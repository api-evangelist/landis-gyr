    register: Wi-Fi Alliance product finder (wi-fi.org/product-finder; prf.cert.wi-fi.org public JSON / CSV)
    standard: Wi-Fi CERTIFIED
    spec_file: null
    role: wi-fi-certified-product
    registered_name: Landis + Gyr
    register_id: WFA140150
    matched_domain: null
    matched_by: register-name
    register_name_note: register-name 'landisgyr' = landis-gyr; no wikidata P856
    certified_products:
    - product: Other
      lapsed: false
      newest_certification: '2026-04-13'
      generations:
      - Wi-Fi 7
      - Wi-Fi 6
      - Wi-Fi 5 (ac)
      - Wi-Fi 4 (n)
    products_sample:
    - Revelo
    signal_note: certified_products = one entry per Wi-Fi Alliance product category, never per product, variant
      or CID; generations are context. Wi-Fi CERTIFIED does not expire and the finder marks nothing withdrawn, so
      lapsed is false

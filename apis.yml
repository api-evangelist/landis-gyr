name: Landis+Gyr
kind: company
description: >-
  Landis+Gyr Group AG is a 130-year-old energy technology company that builds the
  smart electricity, gas and water meters, the RF-mesh and cellular networks, and
  the head-end, meter-data-management and grid-analytics software that utilities
  run advanced metering infrastructure on. It is incorporated in Cham, Switzerland
  and listed on the SIX Swiss Exchange, but after divesting its EMEA business to
  AURELIUS in March 2026 its centre of gravity — and its Americas headquarters and
  much of its executive team — sits in Alpharetta, Georgia, making the United States
  its home market. Landis+Gyr sits one layer UPSTREAM of the consumer: it sells to
  the roughly 2,000 utilities that are themselves the regulated data holders, so no
  data-sharing mandate — not US Green Button, not Ontario's Green Button regulation,
  not Australia's Consumer Data Right for energy — attaches to Landis+Gyr itself.
  Its API posture reflects that. Landis+Gyr publishes NO open market or grid data
  and NO consumer usage API; the meter interval data its Gridstream Connect and MDMS
  products produce reaches households only after a utility customer re-publishes it,
  typically through a third-party Green Button–certified portal that Landis+Gyr does
  not operate. There is a real developer portal at developers.landisgyr.com — the
  Gridstream Connect Apps / Revelo edge-app program, with App Studio, documents,
  learning paths, a Stack Overflow Teams developer forum and a Revelo developer-kit
  request flow — but every content route renders empty without authentication, the
  registration path carries an admin invitation and approval workflow, and the
  corporate site never links to it: the public call to action on the Apps Ecosystem
  page is "Email Our Team", pointing at a sales inquiry form. No OpenAPI, Swagger,
  Postman collection, SDK download or endpoint reference is published anywhere in
  public. The only interoperability standard Landis+Gyr states publicly is Wi-SUN
  FAN certification (15 certified products) over standards-based IPv6 mesh — a
  network standard, not a customer-data standard.

scope_note: >-
  Landis+Gyr publishes no OpenAPI, so NONE of the API-shaped conformance standards
  (OAuth 2.0, OIDC, RFC 9457 problem details, JSON:API, OData, SCIM, pagination or
  idempotency conventions) can be asserted here — there is no contract to read them
  from. What Landis+Gyr does conform to are NETWORK, DEVICE and MANAGEMENT-SYSTEM
  standards, plus the utility integration protocols its head-end speaks. Those are
  recorded below.

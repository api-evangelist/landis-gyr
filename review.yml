  - url: https://www.landisgyr.com/us/en/home/software/gridstream-connect-apps-ecosystem
    type: ProductPage
    note: >-
      Names App Studio ("Java-based Application Development Environment", "Revelo Developer
      Kit - Virtual & Hardware", "Comprehensive set of APIs for meter app development"),
      App Marketplace, App Manager, App Lab and Developer Community — and links to NONE of

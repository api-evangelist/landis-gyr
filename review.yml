  - url: https://www.landisgyr.com/us/en/home/software
    type: ProductPage
    note: Enumerates the software portfolio; mentions integration but no APIs, no standards,
      no Green Button.
  - url: https://developers.landisgyr.com/
    type: DeveloperPortal
    note: Live, real, and entirely gated.
  - url: https://en.wikipedia.org/wiki/Landis%2BGyr
    type: Reference

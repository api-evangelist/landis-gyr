productApiFamily:
  note: >-
    Represented faithfully from Landis+Gyr's own segmentation. NONE of these has a public
    contract; they are recorded as product families, not as APIs, and apis[] in apis.yml is
    deliberately EMPTY.
  families:
    - segment: Metering / usage
      products: [Revelo E360/E660 metering platform, Focus AXe, S4x, G480 ultrasonic
        smart gas meter, RF water modules, Meter Data Management System (MDMS)]
    - segment: Network / connectivity
      products: [Gridstream Connect (RF mesh IPv6, Wi-SUN FAN), cellular LTE-M, Series 6
        and N500/N550 network nodes, N2400/N2450 network gateway]
    - segment: Head-end and orchestration
      products: [Emerge Head End Platform, App Manager, IoT Gateway, TechStudio]
    - segment: Edge application development
      products: [Gridstream Connect Apps Ecosystem — App Studio (Java IDE), App Marketplace,
        App Lab, Revelo Developer Kit (virtual and hardware)]
    - segment: DER / demand response
      products: [Power Center load control, L532 Advanced Load Control Switch,
        Enterprise-to-Edge DERMS (OATI webSmartEnergy)]
    - segment: Analytics and outage
      products: [Analytics Solutions, SmartData for Outage Management]
    - segment: Billing / enterprise integration
      products: [MDUS SAP for Utilities Adapter]
    - segment: Consumer engagement
      products: [Consumer Engagement (white-labelled to the utility)]
    - segment: Smart communities
      products: [Smart Community Center Software, street light controller]

corporateFacts:
  legalName: Landis+Gyr Group AG
  founded: 1896 ("over 130 years" per the company's own who-we-are page)
  domicile: Cham, Zug, Switzerland — moved into a new Cham headquarters in 2026
  americasHeadquarters: 30000 Mill Creek Ave, Suite 100, Alpharetta, Georgia, United States
  listing: SIX Swiss Exchange, ticker LAND
  customers: '"Trusted by more than 2,000 utilities worldwide" (who-we-are page)'
  divestitures:
    - EMEA business sold to AURELIUS, completed 2026 — company states it will "sharpen its
      strategic focus on the Americas and Asia-Pacific regions".
    - EV Solutions business (Ocean EV charging software) — share purchase agreement signed 2025.
    - Rhebo (OT security) sold to Everfield, announced 2026.
  homeMarketRationale: >-
    Swiss-domiciled and Swiss-listed, but after the EMEA exit the Americas is the retained
    core, the Americas headquarters in Alpharetta hosts the majority of the operational
    management team, and the US is the largest market. Recorded here as home market
    United States with the Swiss domicile stated alongside it, not instead of it.

